# Golden path against real GitHub and GitLab repositories (D36, #46). Needs the
# KMDN_E2E_GITHUB_TOKEN and KMDN_E2E_GITLAB_TOKEN secrets (repo / api scope on the throwaway
# projects named by the KMDN_E2E_GITHUB_REPO and KMDN_E2E_GITLAB_REPO variables).
name: e2e nightly
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  github:
    runs-on: ubuntu-latest
    if: ${{ vars.KMDN_E2E_GITHUB_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libdbus-1-dev pkg-config
      - run: cargo test -p kmdn-core --test e2e_github -- --ignored --nocapture
        env:
          KMDN_E2E_GITHUB_TOKEN: ${{ secrets.KMDN_E2E_GITHUB_TOKEN }}
          KMDN_E2E_GITHUB_REPO: ${{ vars.KMDN_E2E_GITHUB_REPO }}
  gitlab:
    runs-on: ubuntu-latest
    if: ${{ vars.KMDN_E2E_GITLAB_REPO != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libdbus-1-dev pkg-config
      - run: cargo test -p kmdn-core --test e2e_gitlab -- --ignored --nocapture
        env:
          KMDN_E2E_GITLAB_TOKEN: ${{ secrets.KMDN_E2E_GITLAB_TOKEN }}
          KMDN_E2E_GITLAB_REPO: ${{ vars.KMDN_E2E_GITLAB_REPO }}
