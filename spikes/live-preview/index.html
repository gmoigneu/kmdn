<!doctype html><html><head><meta charset="utf-8"><title>live preview spike</title>
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0f1115;color:#e6e8ec}
#editor{max-width:80ch;margin:32px auto;font-size:15px;line-height:1.65}
.cm-editor{outline:none}
.cm-lp-h1{font-size:1.8em;font-weight:600;line-height:1.3}
.cm-lp-h2{font-size:1.45em;font-weight:600}
.cm-lp-h3{font-size:1.2em;font-weight:600}
.cm-lp-mark{color:#4a5160}
.cm-lp-em{font-style:italic}.cm-lp-strong{font-weight:700}.cm-lp-strike{text-decoration:line-through}
.cm-lp-code{font-family:"JetBrains Mono",monospace;background:#1a1e27;border-radius:4px;padding:0 .25em}
.cm-lp-fence{background:#151820;border-left:2px solid #262b36;font-family:"JetBrains Mono",monospace;font-size:.92em}

.cm-lp-fm-collapsed{color:#8b93a1;font-size:.85em;cursor:pointer;border:1px solid #262b36;border-radius:6px;padding:2px 8px}
